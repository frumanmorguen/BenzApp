<!DOCTYPE html>
<html lang="ca">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BenzApp - Historial</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

<div style="display:flex; align-items:center; gap:12px; margin-bottom:8px;">

    <button
        onclick="location.href='vehicle.html'"
        style="background:none; border:none; font-size:28px; cursor:pointer; padding:4px 4px 4px 0; margin:0; color:var(--text); line-height:1;">

        ←

    </button>

    <h1 style="margin:0; font-size:32px; font-weight:700;">
        📋 Historial
    </h1>

</div>

<div id="capcaleraVehicle" class="targeta">
</div>

<div class="targeta">

<table class="taulaHistorial">

<thead>

<tr>

<th>Data</th>
<th>Km</th>
<th>L</th>
<th>€</th>
<th>C.</th>
<th>⛽</th>

</tr>

</thead>

<tbody id="cosHistorial">

</tbody>

</table>

</div>

<div id="totals" class="targeta">

</div>

</div>



<!-- MODAL DETALL -->

<div
id="modalDetall"
class="modal ocult">

<div class="finestra">

<h2>Repostatge</h2>

<div id="detallRepostatge">

</div>

<button
id="editar"
class="primari">

✏️ Editar

</button>

<button
id="eliminar"
class="vermell">

🗑️ Eliminar

</button>

<button
id="tancar"
class="primari">

Tancar

</button>

</div>

</div>

<script src="dades.js"></script>
<script src="historial.js"></script>
<script src="tema.js"></script>

</body>

</html>
