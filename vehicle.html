<!DOCTYPE html>
<html lang="ca">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>BenzApp - Vehicle</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

<button class="botoTornar" onclick="history.back()">
    ← Tornar
</button>

<h1>⛽ Repostatge</h1>

<div
id="dadesVehicle"
class="targeta">
</div>


<div class="targeta">

<label>Data</label>

<input
id="data"
type="date">


<label>Hora</label>

<input
id="hora"
type="time">


<label>Quilometratge</label>

<input
id="km"
type="number"
placeholder="125430">


<label>Litres repostats</label>

<input
id="litres"
type="number"
step="0.01"
placeholder="42.50">


<label>Preu litre (€)</label>

<input
id="preu"
type="number"
step="0.001"
placeholder="1.579">


<label>Cost total (€)</label>

<input
id="cost"
type="number"
step="0.01"
placeholder="67.11">


<label>Combustible</label>

<select
id="combustible">

<option value="95">Gasolina 95</option>

<option value="98">Gasolina 98</option>

<option value="Diesel">Dièsel</option>

<option value="GLP">GLP</option>

<option value="GNC">GNC</option>

<option value="Electric">Elèctric</option>

</select>


<label>

<input
id="ple"
type="checkbox">

Dipòsit ple

</label>


<button
id="guardar"
class="verd">

💾 Guardar repostatge

</button>

</div>


<button
class="primari"
onclick="location.href='historial.html'">

📋 Historial

</button>


<button
class="primari"
onclick="location.href='resum.html'">

📊 Resum

</button>


<button
class="primari"
onclick="location.href='index.html'">

⬅ Vehicles

</button>

</div>

<script src="dades.js"></script>
<script src="vehicle.js"></script>

</body>

</html>
