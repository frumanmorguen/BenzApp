<!DOCTYPE html>
<html lang="ca">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>BenzApp - Vehicle</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

<div style="display:flex; align-items:center; gap:12px; margin-bottom:8px;">

    <button
        onclick="location.href='index.html'"
        style="background:none; border:none; font-size:28px; cursor:pointer; padding:4px 4px 4px 0; margin:0; color:var(--text); line-height:1;">

        ←

    </button>

    <h1 style="margin:0; font-size:32px; font-weight:700;">
        ⛽ Repostatge
    </h1>

</div>

<div
id="dadesVehicle"
class="targeta">
</div>


<div class="targeta">

<label>Data</label>

<input
id="data"
type="date">


<label>Hora</label>

<input
id="hora"
type="time">


<label>Quilometratge</label>

<input
id="km"
type="number"
placeholder="125430">


<label>Litres repostats</label>

<input
id="litres"
type="number"
step="0.01"
placeholder="42.50">


<label>Preu litre (€)</label>

<input
id="preu"
type="number"
step="0.001"
placeholder="1.579">


<label>Cost total (€)</label>

<input
id="cost"
type="number"
step="0.01"
placeholder="67.11">


<label>Combustible</label>

<select
id="combustible">

<option value="95">Gasolina 95</option>
<option value="98">Gasolina 98</option>
<option value="Diesel">Dièsel</option>
<option value="GLP">GLP</option>
<option value="GNC">GNC</option>
<option value="E85">E85 (Etanol)</option>
<option value="Hidrogen">Hidrogen</option>
<option value="Electric">Elèctric</option>

</select>


<label>

<input
id="ple"
type="checkbox">

Dipòsit ple

</label>


<button
id="guardar"
class="verd">

💾 Guardar repostatge

</button>

</div>


<div style="display:flex; gap:10px; flex-wrap:wrap;">

    <button
        class="primari"
        onclick="location.href='historial.html'"
        style="flex:1;">

        📋 Historial

    </button>

    <button
        class="primari"
        onclick="location.href='resum.html'"
        style="flex:1;">

        📊 Resum

    </button>

    <button
        class="primari"
        onclick="location.href='index.html'"
        style="flex:1;">

        ⬅ Vehicles

    </button>

</div>

</div>

<script src="dades.js"></script>
<script src="vehicle.js"></script>
<script src="tema.js"></script>

</body>

</html>
