<!DOCTYPE html>
<html lang="ca">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>BenzApp - Vehicle</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

<div style="display:flex; align-items:center; gap:12px; margin-bottom:8px;">

    <button
        onclick="location.href='index.html'"
        style="background:none; border:none; font-size:28px; cursor:pointer; padding:4px 4px 4px 0; margin:0; color:var(--text); line-height:1;">

        ←

    </button>

    <h1 style="margin:0; font-size:32px; font-weight:700;">
        ⛽ Repostatge
    </h1>

</div>

<div
id="dadesVehicle"
class="targeta" style="padding:12px 16px;">
</div>


<div class="targeta" style="padding:12px 16px;">

    <!-- DATA I HORA - MATEIXA LÍNIA -->
    <div style="display:flex; gap:10px;">

        <div style="flex:1;">
            <label style="font-size:13px; margin:0 0 4px 0;">Data</label>
            <input
            id="data"
            type="date"
            style="padding:8px 10px; font-size:15px;">
        </div>

        <div style="flex:1;">
            <label style="font-size:13px; margin:0 0 4px 0;">Hora</label>
            <input
            id="hora"
            type="time"
            style="padding:8px 10px; font-size:15px;">
        </div>

    </div>

    <!-- QUILOMETRATGE -->
    <label style="font-size:13px; margin:8px 0 4px 0;">Quilometratge</label>
    <input
    id="km"
    type="number"
    placeholder="125430"
    style="padding:8px 10px; font-size:15px;">

    <!-- LITRES, PREU, COST - MATEIXA LÍNIA -->
    <div style="display:flex; gap:10px;">

        <div style="flex:1;">
            <label style="font-size:13px; margin:8px 0 4px 0;">Litres</label>
            <input
            id="litres"
            type="number"
            step="0.01"
            placeholder="42.50"
            style="padding:8px 10px; font-size:15px;">
        </div>

        <div style="flex:1;">
            <label style="font-size:13px; margin:8px 0 4px 0;">Preu/L (€)</label>
            <input
            id="preu"
            type="number"
            step="0.001"
            placeholder="1.579"
            style="padding:8px 10px; font-size:15px;">
        </div>

        <div style="flex:1;">
            <label style="font-size:13px; margin:8px 0 4px 0;">Cost (€)</label>
            <input
            id="cost"
            type="number"
            step="0.01"
            placeholder="67.11"
            style="padding:8px 10px; font-size:15px;">
        </div>

    </div>

    <!-- COMBUSTIBLE -->
    <label style="font-size:13px; margin:8px 0 4px 0;">Combustible</label>
    <select
    id="combustible"
    style="padding:8px 10px; font-size:15px;">

    <option value="95">Gasolina 95</option>
    <option value="98">Gasolina 98</option>
    <option value="Diesel">Dièsel</option>
    <option value="GLP">GLP</option>
    <option value="GNC">GNC</option>
    <option value="E85">E85 (Etanol)</option>
    <option value="Hidrogen">Hidrogen</option>
    <option value="Electric">Elèctric</option>

</select>

<!-- DIPÒSIT PLE + GUARDAR - MATEIXA LÍNIA -->
<div style="display:flex; gap:10px; margin-top:10px; align-items:center;">

    <label style="display:flex; align-items:center; gap:6px; margin:0; font-size:15px; cursor:pointer; flex-shrink:0; background:var(--grisBoton); padding:8px 14px; border-radius:12px;">

        <input
        id="ple"
        type="checkbox"
        style="width:18px; height:18px; margin:0; cursor:pointer;">

        <span style="font-weight:600;">Dipòsit ple</span>

    </label>

    <button
    id="guardar"
    class="verd"
    style="flex:1; padding:10px 14px; font-size:16px; margin:0;">

    💾 Guardar

</button>

</div>

</div>


<div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:8px;">

    <button
        class="primari"
        onclick="location.href='historial.html'"
        style="flex:1; padding:10px 14px; font-size:14px;">

        📋 Historial

    </button>

    <button
        class="primari"
        onclick="location.href='resum.html'"
        style="flex:1; padding:10px 14px; font-size:14px;">

        📊 Resum

    </button>

    <button
        class="primari"
        onclick="location.href='index.html'"
        style="flex:1; padding:10px 14px; font-size:14px;">

        ⬅ Vehicles

    </button>

</div>

</div>

<script src="dades.js"></script>
<script src="vehicle.js"></script>
<script src="tema.js"></script>

</body>

</html>
