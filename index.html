<!DOCTYPE html>
<html lang="ca">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>BenzApp</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#0a84ff">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

</head>

<body>

<div class="app">

<h1>⛽ BenzApp</h1>

<p class="subtitol">
Control de consum dels teus vehicles
</p>


<div id="llistaVehicles"
class="llistaVehicles">

</div>


<div style="display:flex; gap:10px; margin-top:8px;">

    <button
        id="botoNouVehicle"
        class="primari"
        style="flex:1;">

        ➕ Nou vehicle

    </button>

    <button
        id="botoConfiguracio"
        class="primari"
        style="flex:0.5; background:var(--grisBoton); color:var(--text); font-size:20px; padding:14px 10px;"
        title="Configuració (tema clar/fosc)">

        ⚙️

    </button>

    <button
        id="botoBackup"
        class="primari"
        style="flex:0.5; background:#5856d6; font-size:14px; padding:14px 10px;"
        title="Fer còpia de seguretat de totes les dades">

        💾 Backup

    </button>

</div>

</div>



<!-- ===========================================
     MODAL VEHICLE
============================================ -->

<div
id="modalVehicle"
class="modal ocult">

<div class="finestra">

<h2 id="titolModal">
Nou vehicle
</h2>


<label>Matrícula</label>

<input
id="matricula"
type="text"
placeholder="1234 ABC">


<label>Marca</label>

<input
id="marca"
type="text"
placeholder="Seat">


<label>Model</label>

<input
id="model"
type="text"
placeholder="Ibiza">


<label>Capacitat dipòsit (L)</label>

<input
id="diposit"
type="number"
step="0.1"
placeholder="45">


<label>Combustible habitual</label>

<select
id="combustible">

<option value="95">Gasolina 95</option>
<option value="98">Gasolina 98</option>
<option value="Diesel">Dièsel</option>
<option value="GLP">GLP</option>
<option value="GNC">GNC</option>
<option value="E85">E85 (Etanol)</option>
<option value="Hidrogen">Hidrogen</option>
<option value="Electric">Elèctric</option>

</select>


<div class="filaBotons">

<button
id="guardarVehicle"
class="verd">

💾 Guardar

</button>


<button
id="cancelarVehicle"
class="vermell">

Cancel·lar

</button>

</div>

</div>

</div>



<script src="dades.js"></script>
<script src="app.js"></script>
<script src="tema.js"></script>

<script>

if("serviceWorker" in navigator){

navigator.serviceWorker.register("service-worker.js");

}

</script>

</body>

</html>
