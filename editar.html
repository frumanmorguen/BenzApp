<!DOCTYPE html>
<html lang="ca">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>BenzApp - Editar repostatge</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

<h1>✏️ Editar repostatge</h1>

<div id="dadesVehicle"
class="targeta">
</div>


<div class="targeta">

<label>Data</label>

<input
id="data"
type="date">


<label>Hora</label>

<input
id="hora"
type="time">


<label>Quilometratge</label>

<input
id="km"
type="number">


<label>Litres</label>

<input
id="litres"
type="number"
step="0.01">


<label>Preu litre (€)</label>

<input
id="preu"
type="number"
step="0.001">


<label>Cost (€)</label>

<input
id="cost"
type="number"
step="0.01">


<label>Combustible</label>

<select
id="combustible">

<option value="95">Gasolina 95</option>

<option value="98">Gasolina 98</option>

<option value="Diesel">Dièsel</option>

<option value="GLP">GLP</option>

<option value="GNC">GNC</option>

<option value="Electric">Elèctric</option>

</select>


<label>

<input
id="ple"
type="checkbox">

Dipòsit ple

</label>


<button
id="guardar"
class="verd">

💾 Guardar canvis

</button>


<button
class="primari"
onclick="history.back()">

⬅ Cancel·lar

</button>

</div>

</div>

<script src="dades.js"></script>
<script src="editar.js"></script>

</body>

</html>
