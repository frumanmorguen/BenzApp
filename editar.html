<!DOCTYPE html>
<html lang="ca">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>BenzApp - Editar repostatge</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

<div style="display:flex; align-items:center; gap:12px; margin-bottom:8px;">

    <button
        onclick="location.href='historial.html'"
        style="background:none; border:none; font-size:28px; cursor:pointer; padding:4px 4px 4px 0; margin:0; color:var(--text); line-height:1;">

        ←

    </button>

    <h1 style="margin:0; font-size:32px; font-weight:700;">
        ✏️ Editar repostatge
    </h1>

</div>

<div id="dadesVehicle"
class="targeta">
</div>


<div class="targeta">

<label>Data</label>

<input
id="data"
type="date">


<label>Hora</label>

<input
id="hora"
type="time">


<label>Quilometratge</label>

<input
id="km"
type="number">


<label>Litres</label>

<input
id="litres"
type="number"
step="0.01">


<label>Preu litre (€)</label>

<input
id="preu"
type="number"
step="0.001">


<label>Cost (€)</label>

<input
id="cost"
type="number"
step="0.01">


<label>Combustible</label>

<select
id="combustible">

<option value="95">Gasolina 95</option>
<option value="98">Gasolina 98</option>
<option value="Diesel">Dièsel</option>
<option value="GLP">GLP</option>
<option value="GNC">GNC</option>
<option value="E85">E85 (Etanol)</option>
<option value="Hidrogen">Hidrogen</option>
<option value="Electric">Elèctric</option>

</select>


<label>

<input
id="ple"
type="checkbox">

Dipòsit ple

</label>


<button
id="guardar"
class="verd">

💾 Guardar canvis

</button>


<button
class="primari"
onclick="location.href='historial.html'"
style="width:100%;">

⬅ Cancel·lar

</button>

</div>

</div>

<script src="dades.js"></script>
<script src="editar.js"></script>
<script src="tema.js"></script>

</body>

</html>
